name: Firmware checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install build dependencies
        run: |
          python -m pip install -r port/requirements.lock.txt
          npm install --global npm@11.6.2
      - name: Check publication boundary
        run: python scripts/check_public.py
      - name: Build and verify firmware
        run: python scripts/k718.py build --out dist/release
      - name: Prepare shareable firmware package
        run: python scripts/package_release.py dist/release --out dist/publish
      - name: Prepare matched firmware pair
        run: python scripts/package_pair.py dist/publish --out dist/paired
      - uses: actions/upload-artifact@v4
        with:
          name: gaggimate-knob-screen-${{ github.sha }}
          path: dist/publish/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: gaggimate-knob-screen-pair-${{ github.sha }}
          path: dist/paired/
          if-no-files-found: error
